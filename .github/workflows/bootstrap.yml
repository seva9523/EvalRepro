name: Bootstrap founding release

on:
  push:
    branches:
      - feat/founding-release
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap.yml
  pull_request:
    branches:
      - main
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evalrepro-founding-release
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Extract, validate, and publish founding branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout founding branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          ref: feat/founding-release
          fetch-depth: 0

      - name: Reconstruct and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum --check
          0487abeb818895afa0fbbdea038130da5289a20e1c180f144a3ea1e60ad7c7b3  bootstrap/part-00.txt
          a3a195746dbbafd08a0cd85a1e79764f7b335177dd93e90ac3b3c292f9dac4c4  bootstrap/part-01.txt
          a702e036a748771be740c6a82a6ad40356fb742ec3294b6fa2d3eeec05098b7e  bootstrap/part-02.txt
          184377a5b8ce37454df1001b9e296580e15a917e70854fc0b52fc0d92852e762  bootstrap/part-03.txt
          EOF
          cat bootstrap/part-*.txt | base64 --decode > /tmp/evalrepro.zip
          echo "a273c50e45ff1338b792af713e497600a402e71fd48e788bf021266559634235  /tmp/evalrepro.zip" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          archive_path = Path("/tmp/evalrepro.zip")
          with zipfile.ZipFile(archive_path) as archive:
              members = archive.infolist()
              for member in members:
                  parts = Path(member.filename).parts
                  if member.filename.startswith("/") or ".." in parts:
                      raise RuntimeError(f"Unsafe archive member: {member.filename}")
              archive.extractall(".")
              print(f"Extracted {len(members)} project files")
          PY
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          ruff format .
          ruff check --fix .
          ruff format .

      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          mypy src/evalrepro
          pytest --cov=evalrepro --cov-report=term-missing
          python -m build
          git diff --check

      - name: Commit validated founding release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish EvalRepro public alpha"
          git push origin HEAD:feat/founding-release
