name: Apply founding type fixes

on:
  push:
    branches:
      - automation/format-founding-release
  pull_request:
    branches:
      - feat/founding-release

permissions:
  contents: write

concurrency:
  group: evalrepro-founding-types
  cancel-in-progress: true

jobs:
  type-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout founding branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          ref: feat/founding-release
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project tools
        run: python -m pip install -e ".[dev]"

      - name: Apply targeted type fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/evalrepro/adapters/inspect.py": [
                  ("from collections.abc import Callable\n", ""),
                  (
                      "if not isinstance(task_factory, Callable):",
                      "if not callable(task_factory):",
                  ),
              ],
              "src/evalrepro/compare.py": [
                  (
                      'return left["sample_limit"] == right["sample_limit"]',
                      'return bool(left["sample_limit"] == right["sample_limit"])',
                  ),
              ],
          }

          for file_name, file_replacements in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in file_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"Expected exactly one occurrence in {file_name}: {old!r}; found {count}"
                      )
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          ruff format .
          ruff format --check .
          ruff check .
          mypy src/evalrepro
          git diff --check

      - name: Commit and push type fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No type changes remain."
            exit 0
          fi
          git config user.name "seva9523"
          git config user.email "188485706+seva9523@users.noreply.github.com"
          git add src
          git commit -m "fix: satisfy strict typing contracts"
          git push origin HEAD:feat/founding-release
