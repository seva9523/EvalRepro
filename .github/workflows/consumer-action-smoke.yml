name: Consumer action smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/consumer-action-smoke.yml"
      - "action.yml"
      - "case-studies/harvey-lab-v3-rubric/results/*.manifest.json"

permissions:
  contents: read

jobs:
  pinned-action:
    name: Pinned GitHub Action
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer fixtures
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare report directory
        run: mkdir -p artifacts/consumer-action-smoke

      - name: Compare pinned hash-only manifests
        uses: seva9523/EvalRepro@v0.1.0a2
        with:
          baseline: case-studies/harvey-lab-v3-rubric/results/baseline.manifest.json
          candidate: case-studies/harvey-lab-v3-rubric/results/candidate.manifest.json
          report-json: artifacts/consumer-action-smoke/report.json
          report-markdown: artifacts/consumer-action-smoke/report.md
          fail-on-drift: "false"

      - name: Verify the expected drift contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/consumer-action-smoke/report.json")
          markdown_path = Path("artifacts/consumer-action-smoke/report.md")
          report = json.loads(report_path.read_text())

          assert report["verdict"] == "semantic_drift", report
          assert report["scope_match"] is True, report
          assert report["coverage_match"] is True, report
          assert report["changed_task_count"] == 250, report
          assert "semantic_drift" in markdown_path.read_text()
          PY
